[package]
name = "waynes-dns-gtk"
version = "0.1.1"
edition = "2021"
description = "GTK4 UI to configure and verify DNS-over-TLS"
license = "MIT"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_24"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.9"
rustls-pki-types = "1.15.1"
